syntax = "proto3";

option go_package = "./pb";

package link;

service link {

  // 打开短链, 获取跳转链接
  rpc GetShortLink(GetShortLinkReq) returns (GetShortLinkResp);

  // 获取授予用户文档权限对应文档
  rpc GetGrantLink(GetGrantDocumentReq) returns (GetGrantDocumentResp);

  // 创建短链
  rpc CreateShortLink(CreateShortLinkReq) returns (CreateShortLinkResp);

  // 创建文档授权链接
  rpc CreateGrantLink(CreateGrantLinkReq) returns (CreateGrantLinkResp);
}

message GetShortLinkReq{
  string Id = 1;
}

message GetShortLinkResp{
  string TargetUrl = 1;
}

message GetGrantDocumentReq{
  string GrantId = 1;
}

message GetGrantDocumentResp{
  string Document = 1;
  string OwnerId = 2;
}

message CreateShortLinkReq {
  string TargetUrl = 1;
  int64 ExpireAt = 2;
}

message CreateShortLinkResp {
  string ShortLink = 1;
}

message CreateGrantLinkReq {
  string DocumentId = 1;
  string UserId = 2;
  int64 ExpireAt = 3;
}

message CreateGrantLinkResp {
  string GrantLink = 1;
}
