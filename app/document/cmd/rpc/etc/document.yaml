Name: document.rpc
ListenOn: 0.0.0.0:1202
Mode: dev
ServerID: 002
Etcd:
  Hosts:
  - etcd:2379
  Key: document.rpc

Log:
  ServiceName: document-rpc
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 4202
  Path: /metrics

Telemetry:
  Name: document-rpc
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: otlphttp

DB:
  DataSource: mutidoc:123456@tcp(172.20.117.80:13306)/mutidoc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
  DriverName: mysql

Cache:
  - Host: redis:6379
    Pass:

RedisConf:
  Addr: redis:6379
  Password:
  DB: 0

# 文档向量库: 相似内容检索
Qdrant:
  Host: qdrant
  Port: 6334
  APIKey:
  UseTLS: false
  Collection: document_chunks
  VectorSize: 1024

# 检索文本向量化: 硅基流动 OpenAI 兼容的 /embeddings 接口, 需与 edit 服务一致
Embedding:
  BaseURL: https://api.siliconflow.cn/v1
  APIKey:
  Model: BAAI/bge-m3
  Dimensions: 0
  Timeout: 30s

# 发布文档快照时创建短链
LinkRpcConf:
  Etcd:
    Hosts:
      - etcd:2379
    Key: link.rpc
  Timeout: 2000
