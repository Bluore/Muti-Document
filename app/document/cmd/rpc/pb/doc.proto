syntax = "proto3";

option go_package = "./pb";

package document;

service document {

  // 创建文档
  rpc CreateDocument(CreateDocumentReq) returns (CreateDocumentResp);

  // 删除文档
  rpc DeleteDocument(DeleteDocumentReq) returns (DeleteDocumentResp);

  // 更新文档(全量更新)
  rpc UpdateDocument(UpdateDocumentReq) returns (UpdateDocumentResp);

  // 获取文档详情(仅元信息)
  rpc GetDocumentInfo(GetDocumentInfoReq) returns (GetDocumentInfoResp);

  // 获取文档列表(仅元信息)
  rpc GetDocumentList(GetDocumentListReq) returns (GetDocumentListResp);

  // 获取文档内容(整合数据库快照与 redis 上未落库的变更)
  rpc GetDocumentContent(GetDocumentContentReq) returns (GetDocumentContentResp);

  // 获取用户是否有授权
  rpc GetDocumentPermission(GetDocumentPermissionReq) returns (GetDocumentPermissionResp);

  // 授权用户文档权限
  rpc GrantaDocumentPermission(GrantDocumentPermissionReq) returns (GrantDocumentPermissionResp);

  // 向量检索文档内容(返回相似度最高的前 K 条分块)
  rpc SearchDocument(SearchDocumentReq) returns (SearchDocumentResp);

  // 发布文档快照, 返回快照短链
  rpc PublishDocumentSnapshot(PublishDocumentSnapshotReq) returns (PublishDocumentSnapshotResp);

  // 获取快照文档内容(无需鉴权)
  rpc GetSnapshotDocument(GetSnapshotDocumentReq) returns (GetSnapshotDocumentResp);
}

message Document{
  string Id = 1;
  string OwnerId = 2;
  string Summary = 3;
  // 文档版本号, 由服务端维护
  int64 Version = 4;
  int64 CreateAt = 5;
  int64 UpdateAt = 6;
  // 软删除时间, 未删除为 0
  int64 DeleteAt = 7;
}

message CreateDocumentReq{
  string OwnerId = 1;
}

message CreateDocumentResp{
  string DocumentId = 1;
}

message DeleteDocumentReq{
  string DocumentId = 1;
}

message DeleteDocumentResp{
}

message UpdateDocumentReq{
  string DocumentId = 1;
  string Summary = 2;
  string Content = 3;
}

message UpdateDocumentResp{
}

message GetDocumentInfoReq{
  string DocumentId = 1;
}

message GetDocumentInfoResp{
  Document DocumentInfo = 1;
}

message GetDocumentListReq{
  // 文档归属者, 只返回该用户的文档
  string OwnerId = 1;
  int64 Page = 2;
  int64 Size = 3;
}

message GetDocumentListResp{
  repeated Document DocumentInfo = 1;
  int64 Total = 2;
}

message GetDocumentContentReq{
  string DocumentId = 1;
}

message GetDocumentContentResp{
  // 整合后的文档正文
  string Content = 1;
  // 整合后的文档标题
  string Summary = 2;
  // 整合后的文档版本号
  int64 Version = 3;
}

message GetDocumentPermissionReq{
  string UserId = 1;
  string DocumentId = 2;
}

message GetDocumentPermissionResp{
  bool HasPermission = 1;
}

message GrantDocumentPermissionReq{
  string UserId = 1;
  string DocumentId = 2;
}

message GrantDocumentPermissionResp{
}

message SearchDocumentReq{
  // 待检索文本, 服务端向量化后查询相似分块
  string Text = 1;
  // 返回条数, <=0 时默认 3
  int64 TopK = 2;
  // 可选, 只在该文档内检索
  string DocumentId = 3;
  // 可选, 只在该用户归属的文档内检索
  string OwnerId = 4;
}

message SearchDocumentResp{
  // 命中分块的 JSON 数组, 每项含 doc_id/owner_id/chunk_index/text/create_at/score
  string Result = 1;
}

message PublishDocumentSnapshotReq{
  string DocumentId = 1;
}

message PublishDocumentSnapshotResp{
  string SnapshotId = 1;
  string ShortLink = 2;
}

message GetSnapshotDocumentReq{
  string SnapshotId = 1;
}

message GetSnapshotDocumentResp{
  string Id = 1;
  string OwnerId = 2;
  string Summary = 3;
  string Content = 4;
  int64 Version = 5;
  int64 CreateAt = 6;
  int64 UpdateAt = 7;
}
