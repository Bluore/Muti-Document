Name: edit-api
Host: 0.0.0.0
Port: 1101
Mode: dev

Rpc:
  Name: edit.rpc
  ListenOn: 0.0.0.0:1205
  Etcd:
    Hosts:
      - etcd:2379
    Key: edit.rpc
  Timeout: 5000

RedisConf:
  Addr: redis:6379
  Password:
  DB: 0

DB:
  DataSource: mutidoc:123456@tcp(172.20.117.80:13306)/mutidoc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
  DriverName: mysql

Cache:
  - Host: redis:6379
    Pass:

# 文档向量库: 正文落库后按块重建索引
Qdrant:
  Host: qdrant
  Port: 6334
  APIKey:
  UseTLS: false
  Collection: document_chunks
  # BAAI/bge-m3 输出 1024 维; 改动后要重建集合
  VectorSize: 1024

# 文本向量化: 硅基流动 OpenAI 兼容的 /embeddings 接口
Embedding:
  BaseURL: https://api.siliconflow.cn/v1
  APIKey:
  Model: BAAI/bge-m3
  # 期望维度, 0 表示用模型默认维度
  Dimensions: 0
  Timeout: 30s

# 文档切块: 每块 Size 个字符, 向前多带 Overlap 个字符保留上下文
Chunk:
  Size: 500
  Overlap: 100

JwtAuth:
  AccessSecret: 123456-456789-123
  AccessExpire: 60

Log:
  ServiceName: edit-api
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 4101
  Path: /metrics

Telemetry:
  Name: edit-api
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

UserRpcConf:
  Etcd:
    Hosts:
      - etcd:2379
    Key: user.rpc
  Timeout: 2000
