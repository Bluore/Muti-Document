Name: document-api
Host: 0.0.0.0
Port: 1101
Mode: dev

JwtAuth:
  AccessSecret: 123456-456789-123
  AccessExpire: 60

Log:
  ServiceName: document-api
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 4101
  Path: /metrics

Telemetry:
  Name: document-api
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: otlphttp

DocumentRpcConf:
  Etcd:
    Hosts:
      - etcd:2379
    Key: document.rpc
  Timeout: 2000

EditRpcConf:
  Etcd:
    Hosts:
      - etcd:2379
    Key: edit.rpc
  Timeout: 2000

LinkRpcConf:
  Etcd:
    Hosts:
      - etcd:2379
    Key: link.rpc
  Timeout: 2000
