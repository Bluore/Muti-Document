Name: agent.rpc
ListenOn: 0.0.0.0:1204
Mode: dev
ServerID: 004
Etcd:
  Hosts:
  - etcd:2379
  Key: agent.rpc

Log:
  ServiceName: agent-rpc
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 4203
  Path: /metrics

Telemetry:
  Name: agent-rpc
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Model:
  APIKey: ""
  BaseURL: https://api.deepseek.com
  Model: deepseek-chat
  Temperature: 1.0
  MaxTokens: 4096

Memory:
  Host: redis:6379
  Pass: ""
  KeyPrefix: "agent:checkpoint:"
  TTL: 24h

MCP:
  Servers:
    - Name: amap-maps
      Type: streamable_http
      URL: https://mcp.api-inference.modelscope.net/46f962d821644a/mcp

DocumentRpcConf:
  Etcd:
    Hosts:
      - etcd:2379
    Key: document.rpc
  Timeout: 2000

EditRpcConf:
  Etcd:
    Hosts:
      - etcd:2379
    Key: edit.rpc
  Timeout: 5000

DB:
  DataSource: mutidoc:123456@tcp(172.20.117.80:13306)/mutidoc?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
  DriverName: mysql

Cache:
  - Host: redis:6379
    Pass:
