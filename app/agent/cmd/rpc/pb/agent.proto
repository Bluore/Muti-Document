syntax = "proto3";

option go_package = "./pb";

package agent;

service agent {

  // 创建会话
  rpc CreateSession(CreateSessionReq) returns (CreateSessionResp);

  // 获取会话
  rpc GetSession(GetSessionReq) returns (GetSessionResp);

  // 恢复会话
  rpc ResumeSession(ResumeSessionReq) returns (ResumeSessionResp);

  // 会话列表
  rpc ListSession(ListSessionReq) returns (ListSessionResp);
}

message Session {
  string SessionId = 1;
  string SessionTitle = 2;
  string UserId = 3;
}

message CreateSessionReq {
  string UserId = 1;
  string Title = 2;
}

message CreateSessionResp {
  Session Session = 1;
}

message GetSessionReq {
  string SessionId = 1;
  // 从字符处开始获取
  int64 Offset = 2;
}

message GetSessionResp {
  string data = 1;
  int64 NewOffset = 2;
  // 会话状态, 取值见 globalkey.SessionStatus
  int32 Status = 3;
}

message ResumeSessionReq {
  string SessionId = 1;
  string UserId = 2;
  string Query = 3;
}

message ResumeSessionResp {
  Session Session = 1;
}

message ListSessionReq {
  string UserId = 1;
}

message ListSessionResp {
  repeated Session Sessions = 1;
}
