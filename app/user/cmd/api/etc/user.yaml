Name: user-api
Host: 0.0.0.0
Port: 1101
Mode: dev

RedisConf:
  Addr: redis:6379
  Password:
  DB: 0

JwtAuth:
  AccessSecret: 123456-456789-123
  AccessExpire: 60

Log:
  ServiceName: user-api
  Level: debug

Prometheus:
  Host: 0.0.0.0
  Port: 4101
  Path: /metrics

Telemetry:
  Name: user-api
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

EmailSender:
  Platform: resend
  ApiKey:
  SenderEmail:

UserRpcConf:
  Etcd:
    Hosts:
      - etcd:2379
    Key: user.rpc
  Timeout: 2000
