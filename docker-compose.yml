version: '3'

services:
  nginx-gateway:
    image: nginx:1.21.5
    container_name: nginx-gateway
    restart: always
    privileged: true
    environment:
      - TZ=Asia/Shanghai
    ports:
      - 8888:8081
      - 8889:8082
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
      - ./data/nginx/log:/var/log/nginx
    networks:
      - mutidoc-net
    depends_on:
      - mutidoc-user-api
      - mutidoc-link-api

  mutidoc-user-api:
    build:
      context: .
      dockerfile: ./app/user/cmd/api/Dockerfile
    container_name: mutidoc-user-api
    command:
      - go
      - run
      - /app/app/user/cmd/api
      - -f
      - /app/deploy/config/user-api.yml
    volumes:
      - .:/app
    ports:
      - 18888:18888
    networks:
      - mutidoc-net

  mutidoc-user-rpc:
    build:
      context: .
      dockerfile: ./app/user/cmd/api/Dockerfile
    container_name: mutidoc-user-rpc
    command:
      - go
      - run
      - /app/app/user/cmd/rpc
      - -f
      - /app/deploy/config/user-rpc.yml
    volumes:
      - .:/app
    ports: []
    networks:
      - mutidoc-net

  mutidoc-document-api:
    build:
      context: .
      dockerfile: ./app/document/cmd/api/Dockerfile
    container_name: mutidoc-document-api
    command:
      - go
      - run
      - /app/app/document/cmd/api
      - -f
      - /app/deploy/config/document-api.yml
    volumes:
      - .:/app
    ports: []
    networks:
      - mutidoc-net

  mutidoc-document-rpc:
    build:
      context: .
      dockerfile: ./app/document/cmd/rpc/Dockerfile
    container_name: mutidoc-document-rpc
    command:
      - go
      - run
      - /app/app/document/cmd/rpc
      - -f
      - /app/deploy/config/document-rpc.yml
    volumes:
      - .:/app
    ports: []
    networks:
      - mutidoc-net

  mutidoc-link-api:
    build:
      context: .
      dockerfile: ./app/link/cmd/api/Dockerfile
    container_name: mutidoc-link-api
    command:
      - go
      - run
      - /app/app/link/cmd/api
      - -f
      - /app/deploy/config/link-api.yml
    volumes:
      - .:/app
    ports: []
    networks:
      - mutidoc-net

  mutidoc-link-rpc:
    build:
      context: .
      dockerfile: ./app/link/cmd/rpc/Dockerfile
    container_name: mutidoc-link-rpc
    command:
      - go
      - run
      - /app/app/link/cmd/rpc
      - -f
      - /app/deploy/config/link-rpc.yml
    volumes:
      - .:/app
    ports:
      - 9999:1201
    networks:
      - mutidoc-net

networks:
  mutidoc-net:
    external: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
