global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "user-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-user-api:4101"

  - job_name: "user-rpc"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-user-rpc:4201"

  - job_name: "document-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-document-api:4101"

  - job_name: "document-rpc"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-document-rpc:4201"

  - job_name: "edit-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-edit-api:4101"

  - job_name: "link-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-link-api:4101"

  - job_name: "link-rpc"
    metrics_path: "/metrics"
