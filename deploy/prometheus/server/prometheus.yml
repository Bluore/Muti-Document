global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "user-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-user-api:4101"

  - job_name: "user-rpc"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-user-rpc:4201"

  - job_name: "document-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "mutidoc-document-api:4101"
